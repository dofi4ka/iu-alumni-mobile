name: Release to RuStore

# ─────────────────────────────────────────────────────────────────────────────
# Builds a signed release APK and uploads it to RuStore via the Public API.
#
# This replaces the removed build-apk.sh (Docker-based local build) and the old
# Google Play workflow. It runs whenever a GitHub Release is published, or
# manually via workflow_dispatch.
#
# Two different sets of credentials are involved — do not confuse them:
#   • APK signing uses YOUR OWN release keystore (.jks). RuStore does not
#     re-sign your app (unlike Google Play App Signing); you upload an APK
#     that is already signed with your key.
#   • RuStore API auth uses a private key + key ID generated in the RuStore
#     Console (Company/Developer → API RuStore). That is the "push" credential.
#
# Required repository secrets — see docs/rustore-setup.md:
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore (e.g. upload)
#   ANDROID_KEY_PASSWORD       key password
#   RUSTORE_KEY_ID             RuStore Console → API RuStore → key ID
#   RUSTORE_PRIVATE_KEY        RuStore Console → API RuStore → private key (PEM)
#   API_BASE_URL / APP_METRICA_KEY / IU_ALUMNI_WEB_SALT  (already exist)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name override (defaults to release tag, then pubspec)'
        required: false
        type: string
      whats_new:
        description: 'Release notes — "What''s new" (Russian, ≤500 chars; defaults to GitHub Release body)'
        required: false
        type: string
      publish_type:
        description: 'Publication type after moderation'
        required: true
        type: choice
        default: INSTANTLY
        options: [INSTANTLY, MANUAL, DELAYED]
      submit_for_review:
        description: 'Submit the draft for moderation after upload'
        required: true
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read

env:
  PACKAGE_NAME: com.innopolis.alumni
  RUSTORE_API: https://public-api.rustore.ru
  # versionCode must increase on every upload. run_number is monotonic per
  # workflow, and the offset leaves room for builds published before this
  # pipeline existed (raise it if you already shipped a code above 100).
  VERSION_CODE_OFFSET: 100

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the 3.32 line: its Dart 3.8.1 satisfies pubspec's
          # `sdk: ^3.8.1` AND predates Dart 3.9's dot-shorthand nodes that
          # crash freezed 2.5.8. "stable" now ships Dart >=3.13.
          flutter-version: 3.32.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter compact

      - name: Resolve version and release notes
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_WHATS_NEW: ${{ inputs.whats_new }}
          INPUT_PUBLISH_TYPE: ${{ inputs.publish_type }}
          INPUT_SUBMIT: ${{ inputs.submit_for_review }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)

          NAME="${INPUT_VERSION_NAME:-}"
          if [ -z "$NAME" ]; then
            if [ -n "${RELEASE_TAG:-}" ]; then
              # A published Release carries its tag, e.g. v1.2.0 → 1.2.0.
              NAME="${RELEASE_TAG#v}"
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              NAME="${GITHUB_REF##*/}"
              NAME="${NAME#v}"
            else
              NAME="$PUBSPEC_VERSION"
            fi
          fi

          WHATS_NEW="${INPUT_WHATS_NEW:-}"
          if [ -z "$WHATS_NEW" ]; then WHATS_NEW="${RELEASE_BODY:-}"; fi
          if [ -z "$WHATS_NEW" ]; then WHATS_NEW="Обновление $NAME"; fi

          PUBLISH_TYPE="${INPUT_PUBLISH_TYPE:-INSTANTLY}"
          SUBMIT="${INPUT_SUBMIT:-true}"
          if [ "$SUBMIT" != "false" ]; then SUBMIT="true"; fi

          CODE=$(( VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER ))

          echo "name=$NAME"               >> "$GITHUB_OUTPUT"
          echo "code=$CODE"               >> "$GITHUB_OUTPUT"
          echo "publish_type=$PUBLISH_TYPE" >> "$GITHUB_OUTPUT"
          echo "submit=$SUBMIT"           >> "$GITHUB_OUTPUT"
          # Release notes can be multiline — persist via a file, not GITHUB_OUTPUT.
          printf '%s' "$WHATS_NEW" > "$RUNNER_TEMP/whats_new.txt"
          echo "Building $NAME ($CODE)"
          echo "publish_type=$PUBLISH_TYPE submit=$SUBMIT"
          echo "whats_new: $(head -c 200 "$RUNNER_TEMP/whats_new.txt")"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — see docs/rustore-setup.md"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "keystore written ($(wc -c < "$RUNNER_TEMP/upload-keystore.jks") bytes)"

      - name: Build signed APK
        env:
          # android/app/build.gradle reads these.
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=APP_METRICA_KEY=${{ secrets.APP_METRICA_KEY }} \
            --dart-define=IU_ALUMNI_WEB_SALT=${{ secrets.IU_ALUMNI_WEB_SALT }}

      - name: Verify the APK is signed with the release key
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          # A debug-signed APK would be rejected by RuStore with a confusing
          # error, so fail here where the cause is obvious. Capture the listing
          # first to avoid a `grep -q` early-exit/SIGPIPE race under pipefail.
          LISTING="$(unzip -l "$APK" 2>/dev/null || true)"
          if grep -Eq 'META-INF/.*\.(RSA|EC|DSA)' <<< "$LISTING"; then
            echo "APK carries a signature block"
          else
            echo "::error::APK does not appear to be signed"
            exit 1
          fi

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iu-alumni-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # ── RuStore Public API ─────────────────────────────────────────────────
      # Flow: /public/auth → (delete any stale draft) → create draft → upload
      # APK → commit (submit for moderation). Every call captures the HTTP code
      # and body so a failed step shows WHY instead of an opaque curl exit.
      - name: Authenticate with RuStore API
        env:
          KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_ID:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo "::error::RUSTORE_KEY_ID / RUSTORE_PRIVATE_KEY are not set — see docs/rustore-setup.md"
            exit 1
          fi

          KEY_FILE=$(mktemp)
          BODY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE" "$BODY_FILE"' EXIT

          # The secret holds a full PEM key (PKCS#1 "RSA PRIVATE KEY" or
          # PKCS#8 "PRIVATE KEY"). openssl signs with either directly.
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # ISO 8601 with millisecond precision and tz offset. Server rejects
          # timestamps more than 60 seconds off, so derive from CI clock.
          TIMESTAMP=$(date +"%Y-%m-%dT%H:%M:%S.%3N%:z")

          # SHA512withRSA over keyId concatenated with timestamp (no separator).
          SIGNATURE=$(printf '%s%s' "$KEY_ID" "$TIMESTAMP" \
            | openssl dgst -sha512 -sign "$KEY_FILE" 2>"$RUNNER_TEMP/openssl.err" \
            | base64 -w0) || true
          if [ -z "$SIGNATURE" ]; then
            echo "::error::openssl produced an empty signature — RUSTORE_PRIVATE_KEY is not a valid PEM key:"
            cat "$RUNNER_TEMP/openssl.err"
            echo "::error::Re-set it with: gh secret set RUSTORE_PRIVATE_KEY < key.pem  (the GitHub UI paste can mangle PEM newlines into literal backslash-n)."
            exit 1
          fi

          set +e
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 60 -o "$BODY_FILE" -w "%{http_code}" -X POST "$RUSTORE_API/public/auth/" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg k "$KEY_ID" --arg t "$TIMESTAMP" --arg s "$SIGNATURE" \
              '{keyId: $k, timestamp: $t, signature: $s}')")
          CURL_EXIT=$?
          set -e

          echo "Auth HTTP $HTTP_CODE"
          echo "Auth response: $(cat "$BODY_FILE")"

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::RuStore auth failed (curl exit $CURL_EXIT, HTTP $HTTP_CODE) — see response above"
            exit 1
          fi

          JWE=$(jq -r '.body.jwe' "$BODY_FILE")
          if [ -z "$JWE" ] || [ "$JWE" = "null" ]; then
            echo "::error::RuStore auth returned HTTP $HTTP_CODE but no JWE in response body"
            exit 1
          fi
          echo "JWE token acquired (TTL: $(jq -r '.body.ttl' "$BODY_FILE")s)"
          echo "JWE_TOKEN=$JWE" >> "$GITHUB_ENV"

      - name: Create RuStore draft
        run: |
          set -euo pipefail
          WHATS_NEW=$(cat "$RUNNER_TEMP/whats_new.txt")
          PUBLISH_TYPE="${{ steps.version.outputs.publish_type }}"

          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT

          # RuStore allows only ONE draft per app. If a previous run left one
          # behind (e.g. it failed after creating the draft), delete it first so
          # re-runs are idempotent. Note: this also deletes any draft you were
          # editing manually in the console.
          set +e
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 60 -o "$BODY_FILE" -w "%{http_code}" \
            "$RUSTORE_API/public/v1/application/$PACKAGE_NAME/version?versionStatuses=DRAFT" \
            -H "Public-Token: $JWE_TOKEN")
          CURL_EXIT=$?
          set -e

          echo "List drafts HTTP $HTTP_CODE"
          echo "List drafts response: $(cat "$BODY_FILE")"

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Could not list RuStore drafts (curl exit $CURL_EXIT, HTTP $HTTP_CODE) — see response above"
            exit 1
          fi

          EXISTING_DRAFT=$(jq -r '.body.content[0].versionId // empty' "$BODY_FILE")
          if [ -n "$EXISTING_DRAFT" ] && [ "$EXISTING_DRAFT" != "null" ]; then
            echo "Found existing draft $EXISTING_DRAFT — deleting it"
            set +e
            HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 60 -o "$BODY_FILE" -w "%{http_code}" -X DELETE \
              "$RUSTORE_API/public/v1/application/$PACKAGE_NAME/version/$EXISTING_DRAFT" \
              -H "Public-Token: $JWE_TOKEN")
            CURL_EXIT=$?
            set -e
            echo "Delete draft HTTP $HTTP_CODE"
            echo "Delete draft response: $(cat "$BODY_FILE")"
            if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::Could not delete existing draft $EXISTING_DRAFT (curl exit $CURL_EXIT, HTTP $HTTP_CODE)"
              exit 1
            fi
          else
            echo "No existing draft — creating a new one"
          fi

          set +e
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 60 -o "$BODY_FILE" -w "%{http_code}" -X POST \
            "$RUSTORE_API/public/v1/application/$PACKAGE_NAME/version" \
            -H "Content-Type: application/json" \
            -H "Public-Token: $JWE_TOKEN" \
            -d "$(jq -n --arg n "$WHATS_NEW" --arg p "$PUBLISH_TYPE" \
              '{appName: "IU Alumni", appType: "MAIN", publishType: $p, whatsNew: $n}')")
          CURL_EXIT=$?
          set -e

          echo "Create draft HTTP $HTTP_CODE"
          echo "Create draft response: $(cat "$BODY_FILE")"

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Create draft failed (curl exit $CURL_EXIT, HTTP $HTTP_CODE) — see response above"
            exit 1
          fi

          # RuStore returns the new version_id as a scalar under .body, but
          # handle a wrapped shape too in case the API tightens.
          VERSION_ID=$(jq -r '.body | if type == "object" then (.version_id // .id // empty) else . end' "$BODY_FILE")
          if [ -z "$VERSION_ID" ] || [ "$VERSION_ID" = "null" ]; then
            echo "::error::Create draft returned HTTP $HTTP_CODE but no version_id in response body"
            exit 1
          fi
          echo "Draft created: version_id=$VERSION_ID"
          echo "VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"

      - name: Upload APK to RuStore
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "Uploading $APK to version $VERSION_ID..."

          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT

          # -F (multipart body) is orthogonal to -o/-w (response capture). APKs
          # can be tens of MB, so allow 10 minutes here; auth/create/commit stay
          # at 60s. isMainApk=true marks this as the default APK; servicesType
          # Unknown = a standard (non-HMS) build.
          set +e
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 600 -o "$BODY_FILE" -w "%{http_code}" -X POST \
            "$RUSTORE_API/public/v1/application/$PACKAGE_NAME/version/$VERSION_ID/apk?servicesType=Unknown&isMainApk=true" \
            -H "Public-Token: $JWE_TOKEN" \
            -F "file=@$APK")
          CURL_EXIT=$?
          set -e

          echo "Upload APK HTTP $HTTP_CODE"
          echo "Upload APK response: $(cat "$BODY_FILE")"

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::APK upload failed (curl exit $CURL_EXIT, HTTP $HTTP_CODE) — see response above"
            exit 1
          fi

          CODE=$(jq -r '.code' "$BODY_FILE")
          if [ "$CODE" != "OK" ]; then
            echo "::error::APK upload returned HTTP $HTTP_CODE but code=$CODE (expected OK)"
            exit 1
          fi
          echo "APK uploaded successfully"

      - name: Submit for moderation
        if: steps.version.outputs.submit == 'true'
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT

          set +e
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 60 -o "$BODY_FILE" -w "%{http_code}" -X POST \
            "$RUSTORE_API/public/v1/application/$PACKAGE_NAME/version/$VERSION_ID/commit?priorityUpdate=0" \
            -H "Public-Token: $JWE_TOKEN")
          CURL_EXIT=$?
          set -e

          echo "Submit HTTP $HTTP_CODE"
          echo "Submit response: $(cat "$BODY_FILE")"

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Submit for moderation failed (curl exit $CURL_EXIT, HTTP $HTTP_CODE) — see response above"
            exit 1
          fi

          CODE=$(jq -r '.code' "$BODY_FILE")
          if [ "$CODE" != "OK" ]; then
            echo "::error::Submit returned HTTP $HTTP_CODE but code=$CODE (expected OK)"
            exit 1
          fi
          echo "✅ RuStore upload complete — version $VERSION_ID submitted for moderation"

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" "$RUNNER_TEMP/whats_new.txt" "$RUNNER_TEMP/openssl.err"
